[package]
name = "default-components"
version = "3.1.0"
edition = "2024"

[features]
# utils
filters = []
# api/web "notifications"
api = ["filters", "dep:api-types", "dep:serde_json", "dep:axum"]
websockets = ["filters", "dep:api-types", "dep:tokio", "dep:serde_json", "dep:axum", "axum/ws"]
frontend = ["api", "websockets"]
# notifications
ntfy-notifications = ["filters", "dep:url", "dep:tokio", "dep:strfmt", "dep:reqwest"]
email-notifications = ["filters", "dep:lettre", "dep:tokio"]
# status providers
dataminer-status = ["dep:chrono", "dep:tokio", "dep:axum"]
minecraft-status = ["dep:chrono", "dep:serde_json", "dep:minecraft-net", "dep:tokio"]
website-status = ["filters", "dep:reqwest", "dep:chrono", "dep:tokio"]
# other
names = []
#historization
history = ["dep:thiserror"]
history-fs-json-backend = ["history", "dep:serde_json"]
history-sqlite-backend = ["history", "dep:rusqlite", "rusqlite/bundled", "rusqlite/trace", "dep:parking_lot"]


# definitions for better mass importing
all-utils = ["filters"]
all-status = ["dataminer-status", "minecraft-status", "website-status"]
all-other = ["names", "all-history-backends"]
all-history-backends = ["history-fs-json-backend", "history-sqlite-backend"]
all-notifications = [
    "api", "websockets", "frontend",
    "email-notifications", "ntfy-notifications"
]
all = ["all-utils", "all-status", "all-notifications", "all-other"]
default = ["all-status", "all-notifications", "all-other"]

[dependencies]
# used in basically every scenario
tracing.workspace = true # debugging/logging
utils = { workspace = true, features = ["duration-parsing"] } # utilities
serde.workspace = true # config
server.workspace = true
bytecode.workspace = true

# common
tokio = { workspace = true, optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true } # NTFY, website-status
chrono = { workspace = true, optional = true } # usually status providers
thiserror = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

# API & frontend
axum = { workspace = true, optional = true }
# api
api-types = { workspace = true, features = ["server-support"], optional = true }
serde_json = { version = "1", optional = true }

# NTFY
url = { version = "2.5", features = ["serde"], optional = true }
strfmt = { version = "0.2", optional = true }

# E-Mail
lettre = { version = "0.11", optional = true }
minecraft-net = { version = "0.1.0", optional = true }

# historization
rusqlite =  { version = "0.40", optional = true }

[dev-dependencies]
toml = "1.1"
utils = { workspace = true, features = ["defaulted-optional"] }